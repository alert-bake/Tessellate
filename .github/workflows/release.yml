name: Build & Release (Optimized)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build and sign an optimized release APK (otherwise debug build + tests)"
        required: true
        type: boolean
        default: false

jobs:
  build-debug:
    name: Build Debug APK & Run Unit Tests
    if: github.event_name == 'push' || inputs.release_build == false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/*.apk
          archive: false
          retention-days: 7

  build-release:
    name: Optimize, Build & Sign Release APK
    if: github.event_name == 'workflow_dispatch' && inputs.release_build == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Oxipng binary
        shell: bash
        run: |
          set -euo pipefail
          OXIPNG_VERSION="10.2.1"
          OXIPNG_ARCHIVE="oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          OXIPNG_SHA256="46e3c4beb9aae57290ad809dd3374b07153579d3322a3778c53900633618b7c6"
          OXIPNG_URL="https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VERSION}/${OXIPNG_ARCHIVE}"
          INSTALL_DIR="${RUNNER_TEMP}/oxipng-bin"
          mkdir -p "$INSTALL_DIR" "$RUNNER_TEMP/oxipng-extract"

          curl --fail --location --silent --show-error "$OXIPNG_URL" --output "$RUNNER_TEMP/$OXIPNG_ARCHIVE"
          echo "$OXIPNG_SHA256  $RUNNER_TEMP/$OXIPNG_ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$OXIPNG_ARCHIVE" -C "$RUNNER_TEMP/oxipng-extract"
          OXIPNG_SOURCE="$(find "$RUNNER_TEMP/oxipng-extract" -type f -name oxipng -print -quit)"
          test -n "$OXIPNG_SOURCE"
          install -m 0755 "$OXIPNG_SOURCE" "$INSTALL_DIR/oxipng"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          oxipng --version

      - name: Restore optimized PNG cache
        uses: actions/cache@v4
        with:
          path: .oxipng-cache
          key: oxipng-v2-${{ runner.os }}-${{ hashFiles('.github/scripts/optimize_textures.py', 'app/src/main/assets/**/*.png') }}
          restore-keys: |
            oxipng-v2-${{ runner.os }}-

      - name: Optimize PNG assets
        run: python3 .github/scripts/optimize_textures.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing! Please configure it in Repository Secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"
          chmod 600 "${{ runner.temp }}/my-upload-key.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found in build outputs!"
            exit 1
          fi
          echo "Found release APK: $APK_PATH"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/*.apk
          archive: false
          retention-days: 14

      - name: Secure Keystore Cleanup
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
