name: Build & Release (Unoptimized)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build & Sign Unoptimized Release APK (R8 Disabled)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing! Please configure it in Repository Secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"
          chmod 600 "${{ runner.temp }}/my-upload-key.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleUnoptimizedRelease --stacktrace

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/unoptimizedRelease -type f -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found in build outputs!"
            exit 1
          fi
          echo "Found release APK: $APK_PATH"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/*.apk
          archive: false
          retention-days: 14

      - name: Secure Keystore Cleanup
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
