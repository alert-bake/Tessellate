name: Oxipng Test Releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxipng-test-release:
    name: Optimize textures and build test release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Install pinned oxipng
        run: cargo install oxipng --version 9.1.5 --locked

      - name: Restore optimized PNG cache
        uses: actions/cache@v4
        with:
          path: .oxipng-cache
          key: oxipng-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            oxipng-v1-${{ runner.os }}-

      - name: Optimize asset PNGs
        run: python3 .github/scripts/optimize_textures.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"

      - name: Build minified and optimized release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature and report size
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"
          stat -c 'Test release APK: %n (%s bytes)' "$APK_PATH"

      - name: Upload Oxipng test release
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-oxipng-test-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
