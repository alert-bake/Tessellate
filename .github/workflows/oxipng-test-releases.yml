name: Oxipng Test Releases

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  oxipng-test-release:
    name: Compare main and optimized experimental APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Checkout main for baseline comparison
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Install pinned oxipng
        run: cargo install oxipng --version 10.2.1 --locked

      - name: Restore optimized PNG cache
        id: oxipng-cache
        uses: actions/cache@v4
        with:
          path: .oxipng-cache
          key: oxipng-v2-${{ runner.os }}-${{ hashFiles('.github/scripts/optimize_textures.py', 'app/src/main/assets/**/*.png') }}
          restore-keys: |
            oxipng-v2-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: |
          chmod +x gradlew
          chmod +x baseline/gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"
          chmod 600 "${{ runner.temp }}/my-upload-key.jks"

      - name: Build unmodified main baseline APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            ./baseline/gradlew -p baseline :app:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/baseline-gradle.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ] || ! grep -Eqi 'HTTP[^0-9]*(429|5[0-9]{2})|status code (429|5[0-9]{2})|Too Many Requests|Read timed out|Connection reset|Temporary failure' "$RUNNER_TEMP/baseline-gradle.log"; then
              exit "$status"
            fi
            echo "Transient repository/network failure. Retrying baseline build ($((attempt + 1))/3)..."
            sleep $((attempt * 20))
          done

      - name: Preserve baseline APK
        run: |
          set -euo pipefail
          APK_PATH=$(find baseline/app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Main baseline APK not found."
            exit 1
          fi
          cp "$APK_PATH" "${{ runner.temp }}/tessellate-main-baseline.apk"

      - name: Optimize experimental branch asset PNGs
        id: optimize
        run: python3 .github/scripts/optimize_textures.py

      - name: Remove obsolete Oxipng Actions caches
        if: always() && steps.optimize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: oxipng-v2-${{ runner.os }}-${{ hashFiles('.github/scripts/optimize_textures.py', 'app/src/main/assets/**/*.png') }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select((.key | startswith("oxipng-v1-")) or (.key | startswith("oxipng-v2-"))) | select(.key != env.CURRENT_CACHE_KEY) | .id' |
          while IFS= read -r cache_id; do
            [ -z "$cache_id" ] && continue
            echo "Deleting obsolete Oxipng cache ID $cache_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
          done

      - name: Build minified experimental APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/experimental-gradle.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ] || ! grep -Eqi 'HTTP[^0-9]*(429|5[0-9]{2})|status code (429|5[0-9]{2})|Too Many Requests|Read timed out|Connection reset|Temporary failure' "$RUNNER_TEMP/experimental-gradle.log"; then
              exit "$status"
            fi
            echo "Transient repository/network failure. Retrying experimental build ($((attempt + 1))/3)..."
            sleep $((attempt * 20))
          done

      - name: Verify signatures and compare APK sizes
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_APK="${{ runner.temp }}/tessellate-main-baseline.apk"
          EXPERIMENTAL_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          if [ ! -f "$BASELINE_APK" ] || [ -z "$EXPERIMENTAL_APK" ]; then
            echo "::error::One or both comparison APKs are missing."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$BASELINE_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$EXPERIMENTAL_APK"

          BASELINE_SIZE=$(stat -c %s "$BASELINE_APK")
          EXPERIMENTAL_SIZE=$(stat -c %s "$EXPERIMENTAL_APK")
          DIFFERENCE=$((BASELINE_SIZE - EXPERIMENTAL_SIZE))
          PERCENT=$(python3 -c 'import sys; a,b=map(int,sys.argv[1:]); print(f"{(a-b)/a*100:.2f}")' "$BASELINE_SIZE" "$EXPERIMENTAL_SIZE")
          echo "baseline_size=$BASELINE_SIZE" >> "$GITHUB_OUTPUT"
          echo "experimental_size=$EXPERIMENTAL_SIZE" >> "$GITHUB_OUTPUT"
          echo "difference=$DIFFERENCE" >> "$GITHUB_OUTPUT"
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"

          {
            echo "## Oxipng release comparison"
            echo
            echo "| Metric | Result |"
            echo "|:--|--:|"
            echo "| Main baseline APK | $(numfmt --to=iec-i --suffix=B "$BASELINE_SIZE") ($BASELINE_SIZE bytes) |"
            echo "| Optimized APK | $(numfmt --to=iec-i --suffix=B "$EXPERIMENTAL_SIZE") ($EXPERIMENTAL_SIZE bytes) |"
            echo "| Size reduction | $(numfmt --to=iec-i --suffix=B "$DIFFERENCE") ($PERCENT%) |"
            echo
            if [ "$DIFFERENCE" -gt 0 ]; then
              echo "Result: optimized APK is smaller."
            elif [ "$DIFFERENCE" -eq 0 ]; then
              echo "Result: APK sizes are identical."
            else
              echo "Result: optimized APK is larger by $(numfmt --to=iec-i --suffix=B "$((-DIFFERENCE))")."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload main baseline APK
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-main-baseline
          path: ${{ runner.temp }}/tessellate-main-baseline.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized experimental APK
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-oxipng-test-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
