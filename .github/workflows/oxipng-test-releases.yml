name: Oxipng Test Releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxipng-test-release:
    name: Compare main and optimized experimental APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Checkout main for baseline comparison
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Install pinned oxipng
        run: cargo install oxipng --version 10.2.1 --locked

      - name: Restore optimized PNG cache
        uses: actions/cache@v4
        with:
          path: .oxipng-cache
          key: oxipng-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            oxipng-v1-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: |
          chmod +x gradlew
          chmod +x baseline/gradlew

      - name: Run experimental branch unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"

      - name: Build unmodified main baseline APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./baseline/gradlew -p baseline :app:assembleRelease --stacktrace

      - name: Preserve baseline APK
        run: |
          APK_PATH=$(find baseline/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Main baseline APK not found."
            exit 1
          fi
          cp "$APK_PATH" "${{ runner.temp }}/tessellate-main-baseline.apk"

      - name: Optimize experimental branch asset PNGs
        run: python3 .github/scripts/optimize_textures.py

      - name: Build minified experimental APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signatures and compare APK sizes
        run: |
          BASELINE_APK="${{ runner.temp }}/tessellate-main-baseline.apk"
          EXPERIMENTAL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$EXPERIMENTAL_APK" ]; then
            echo "::error::Experimental APK not found."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$BASELINE_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$EXPERIMENTAL_APK"

          BASELINE_SIZE=$(stat -c %s "$BASELINE_APK")
          EXPERIMENTAL_SIZE=$(stat -c %s "$EXPERIMENTAL_APK")
          echo "Main baseline APK: $BASELINE_SIZE bytes"
          echo "Experimental APK: $EXPERIMENTAL_SIZE bytes"
          python3 -c 'import sys; a,b=map(int,sys.argv[1:]); d=a-b; print(f"Difference: {d:+,} bytes ({d/a*100:+.2f}%)")' "$BASELINE_SIZE" "$EXPERIMENTAL_SIZE"

      - name: Upload main baseline APK
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-main-baseline
          path: ${{ runner.temp }}/tessellate-main-baseline.apk
          archive: false
          retention-days: 14

      - name: Upload optimized experimental APK
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-oxipng-test-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
