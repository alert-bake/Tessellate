name: Oxipng Test Releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selector-stub:
    name: Register workflow selector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Open Gradle, then stop
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          echo "Selector stub complete. The real Oxipng test runs from optimization-experiments."
