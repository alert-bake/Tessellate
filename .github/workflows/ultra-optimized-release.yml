name: Ultra-Optimized Release (Maximum Oxipng)

on:
  workflow_dispatch:

jobs:
  ultra-release:
    name: Maximum Lossless PNG Optimization, Build & Sign
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Oxipng binary
        shell: bash
        run: |
          set -euo pipefail
          OXIPNG_VERSION="10.2.1"
          OXIPNG_ARCHIVE="oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          OXIPNG_SHA256="46e3c4beb9aae57290ad809dd3374b07153579d3322a3778c53900633618b7c6"
          OXIPNG_URL="https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VERSION}/${OXIPNG_ARCHIVE}"
          INSTALL_DIR="${RUNNER_TEMP}/oxipng-bin"
          mkdir -p "$INSTALL_DIR"

          curl --fail --location --silent --show-error "$OXIPNG_URL" --output "$RUNNER_TEMP/$OXIPNG_ARCHIVE"
          echo "$OXIPNG_SHA256  $RUNNER_TEMP/$OXIPNG_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oxipng-extract"
          tar -xzf "$RUNNER_TEMP/$OXIPNG_ARCHIVE" -C "$RUNNER_TEMP/oxipng-extract"
          OXIPNG_SOURCE="$(find "$RUNNER_TEMP/oxipng-extract" -type f -name oxipng -print -quit)"
          test -n "$OXIPNG_SOURCE"
          install -m 0755 "$OXIPNG_SOURCE" "$INSTALL_DIR/oxipng"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          export PATH="$INSTALL_DIR:$PATH"
          oxipng --version

      - name: Restore ultra Oxipng cache
        uses: actions/cache@v4
        with:
          path: .oxipng-ultra-cache
          key: oxipng-ultra-v1-${{ runner.os }}-${{ hashFiles('.github/scripts/optimize_textures_ultra.py', 'app/src/main/assets/**/*.png') }}
          restore-keys: |
            oxipng-ultra-v1-${{ runner.os }}-

      - name: Run Maximum-Effort Lossless PNG Optimization
        run: python3 .github/scripts/optimize_textures_ultra.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing! Please configure it in Repository Secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/my-upload-key.jks"
          chmod 600 "${{ runner.temp }}/my-upload-key.jks"

      - name: Build Signed Ultra-Optimized Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found in build outputs!"
            exit 1
          fi
          echo "Found ultra-optimized release APK: $APK_PATH"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"

      - name: Upload Ultra-Optimized APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-ultra-optimized-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
          retention-days: 14

      - name: Secure Keystore Cleanup
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"
